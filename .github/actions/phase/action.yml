name: Run pipeline phase
description: Run one main.py phase in the kbsync image with ./out mounted, then publish its summary.

inputs:
  args:
    description: "main.py arguments, e.g. 'fetch' or 'plan --mark-stale 3'"
    required: true

runs:
  using: composite
  steps:
    - name: Run main.py ${{ inputs.args }}
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: |
        mkdir -p out && chmod -R a+rwX out   # container runs as non-root (uid 65532)
        docker run --rm \
          -e OPENAI_API_KEY -e VECTOR_STORE_ID -e MAX_NEW_PER_RUN \
          -e OUTPUT_DIR=/app/out/articles \
          -e GITHUB_STEP_SUMMARY=/app/out/.step_summary.md \
          -v "$PWD/out:/app/out" \
          kbsync main.py $ARGS

    - name: Publish phase summary
      if: always()
      shell: bash
      run: |
        if [ -f out/.step_summary.md ]; then
          cat out/.step_summary.md >> "$GITHUB_STEP_SUMMARY"
          rm out/.step_summary.md
        fi
