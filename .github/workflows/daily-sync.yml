name: daily-sync

# Each pipeline phase is its own job, so the run graph shows where a run failed
# and how long each phase took. Phases hand files to each other as artifacts
# (raw articles -> Markdown -> chunks -> plan -> report); every job runs the same
# Docker image, built once by the first job.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      mark_stale:
        description: "Demo only: mark N synced articles stale before syncing (0 = off)"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: kb-sync # never run two syncs against the store at once
  cancel-in-progress: false

env:
  MAX_NEW_PER_RUN: ${{ vars.MAX_NEW_PER_RUN || '100' }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # the jobs never push; don't leave a token in .git/config
      - name: Build
        run: docker build -t kbsync .
      - name: Export image
        run: docker save kbsync | gzip > kbsync.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: kbsync.tar.gz
          compression-level: 0 # already gzipped
          retention-days: 1

  fetch:
    name: Fetch articles
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/phase
        with: { args: fetch }
      - uses: actions/upload-artifact@v7
        with:
          name: 1-raw-articles
          path: |
            out/raw/
            out/fetch.log

  convert:
    name: Convert to Markdown
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: 1-raw-articles, path: out }
      - uses: ./.github/actions/phase
        with: { args: convert }
      - uses: actions/upload-artifact@v7
        with:
          name: 2-markdown
          path: |
            out/articles/
            out/convert.log

  chunk:
    name: Chunk
    needs: convert
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: 1-raw-articles, path: out }
      - uses: actions/download-artifact@v8
        with: { name: 2-markdown, path: out }
      - uses: ./.github/actions/phase
        with: { args: chunk }
      - uses: actions/upload-artifact@v7
        with:
          name: 3-chunks
          path: |
            out/chunks/
            out/chunk.log

  compare:
    name: Compare with vector store
    needs: chunk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VECTOR_STORE_ID: ${{ vars.VECTOR_STORE_ID }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: 3-chunks, path: out }
      - uses: ./.github/actions/phase
        with:
          args: plan --mark-stale ${{ inputs.mark_stale || 0 }}
      - uses: actions/upload-artifact@v7
        with:
          name: 4-plan
          path: |
            out/plan.json
            out/plan.log

  upload:
    name: Upload delta
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VECTOR_STORE_ID: ${{ vars.VECTOR_STORE_ID }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: 3-chunks, path: out }
      - uses: actions/download-artifact@v8
        with: { name: 4-plan, path: out }
      - uses: ./.github/actions/phase
        with: { args: upload }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 5-run-report
          path: |
            out/run_report.json
            out/upload.log
