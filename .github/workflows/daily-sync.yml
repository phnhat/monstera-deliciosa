name: daily-sync

# One job, one step per pipeline phase: each phase gets its own status and
# timing in the run view, so a failure shows exactly which phase broke.
# Phases are short and strictly sequential, so steps (not separate jobs)
# avoid per-job runner start-up and passing the image between machines.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      mark_stale:
        description: "Demo only: mark N synced articles stale before syncing (0 = off)"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: kb-sync # never run two syncs against the store at once
  cancel-in-progress: false

env:
  MAX_NEW_PER_RUN: ${{ vars.MAX_NEW_PER_RUN || '100' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # the job never pushes; don't leave a token in .git/config

      - name: Build image
        run: docker build -t kbsync .

      - name: Fetch articles
        uses: ./.github/actions/phase
        with:
          args: fetch

      - name: Convert to Markdown
        uses: ./.github/actions/phase
        with:
          args: convert

      - name: Chunk
        uses: ./.github/actions/phase
        with:
          args: chunk

      - name: Compare with vector store
        uses: ./.github/actions/phase
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTOR_STORE_ID: ${{ vars.VECTOR_STORE_ID }}
        with:
          args: plan --mark-stale ${{ inputs.mark_stale || 0 }}

      - name: Upload delta
        uses: ./.github/actions/phase
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTOR_STORE_ID: ${{ vars.VECTOR_STORE_ID }}
        with:
          args: upload

      - name: Upload run artifact (raw, Markdown, chunks, plan, report, logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kb-sync-run-${{ github.run_number }}
          path: out/
          retention-days: 30
