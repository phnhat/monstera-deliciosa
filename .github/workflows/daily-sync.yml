name: daily-sync

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      mark_stale:
        description: "Demo only: mark N synced articles stale before syncing (0 = off)"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: kb-sync # never run two syncs against the store at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # the job never pushes; don't leave a token in .git/config

      - name: Build image
        run: docker build -t kbsync .

      - name: Scrape and sync vector store
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTOR_STORE_ID: ${{ vars.VECTOR_STORE_ID }}
          MAX_NEW_PER_RUN: ${{ vars.MAX_NEW_PER_RUN || '100' }}
          MARK_STALE: ${{ inputs.mark_stale || 0 }}
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm \
            -e OPENAI_API_KEY -e VECTOR_STORE_ID -e MAX_NEW_PER_RUN \
            -e OUTPUT_DIR=/app/out/articles \
            -e GITHUB_STEP_SUMMARY=/app/out/step_summary.md \
            -v "$PWD/out:/app/out" \
            kbsync main.py --mark-stale "$MARK_STALE"

      - name: Publish run summary
        if: always()
        run: cat out/step_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload run artifact (report, log, Markdown, chunks)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kb-sync-run-${{ github.run_number }}
          path: out/
          retention-days: 30
